spring:
  application:
    name: loan-application-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/loan_platform?currentSchema=loan_application}
    username: ${SPRING_DATASOURCE_USERNAME:loan_application_user}
    password: ${SPRING_DATASOURCE_PASSWORD:loan_application_password}
  flyway:
    default-schema: loan_application
    schemas: loan_application
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
platform:
  kafka:
    topics:
      loan-application-events: loan.application.events.v1
  outbox:
    publish-delay-ms: 1000
server:
  port: ${SERVER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
